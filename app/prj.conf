# ── Application ──────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="Ring-One | Dotstar Systems and Consulting"

# ── BLE ──────────────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Ring-One"
CONFIG_BT_DEVICE_APPEARANCE=833
CONFIG_BT_MAX_CONN=1
CONFIG_BT_SMP=y
CONFIG_BT_LL_SOFTDEVICE=y

# ── GATT ─────────────────────────────────────────────────────────────
CONFIG_BT_GATT_DYNAMIC_DB=n

# ── Sensor ───────────────────────────────────────────────────────────
CONFIG_SENSOR=y

# ── Power management ─────────────────────────────────────────────────
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# ── Logging ──────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# ── GATT Device Information Service ──────────────────────────────────
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="Dotstar Systems and Consulting"
CONFIG_BT_DIS_MODEL_NUMBER=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="Ring-One"
CONFIG_BT_DIS_HW_REV=y
CONFIG_BT_DIS_HW_REV_STR="1.0"
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_FW_REV_STR="0.1.0"
CONFIG_BT_DIS_SERIAL_NUMBER=y
CONFIG_BT_DIS_SERIAL_NUMBER_STR="r1"
CONFIG_BT_DIS_PNP=n

# ── Assert ───────────────────────────────────────────────────────────
CONFIG_ASSERT=y

# ── Wi-Fi (nRF7002 via shield) ──────────────────────────────────────
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_AP=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_THREAD_STACK_SIZE=8192
CONFIG_NRF70_AP_MODE=y

# ── BLE + Wi-Fi coexistence (CRITICAL — Dotstar differentiator) ─────
# MPSL_CX and MPSL_CX_NRF700X are auto-selected by Kconfig from the DTS
# nrf_radio_coex node added by the nrf7002eb2_coex shield overlay.
# Do NOT set them manually — DTS-driven selection via dt_nodelabel_enabled.
CONFIG_NRF70_SR_COEX=y

# ── Shell (debug: Wi-Fi and credential provisioning) ─────────────────
CONFIG_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_WIFI_CREDENTIALS_SHELL=y

# ── Networking stack ────────────────────────────────────────────────
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_NETWORKING=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_AI_MAX_ENTRIES=4
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_MAX_CONN=8
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_CONNECTION_MANAGER=y
# Must be disabled when SoftAP provisioning library manages its own IP config
CONFIG_NET_CONFIG_AUTO_INIT=n

# ── Wi-Fi connectivity layer ────────────────────────────────────────
CONFIG_L2_WIFI_CONNECTIVITY=y
# Auto-connect disabled — we call conn_mgr_all_if_connect() after SoftAP
CONFIG_L2_WIFI_CONNECTIVITY_AUTO_CONNECT=n
CONFIG_L2_WIFI_CONNECTIVITY_AUTO_DOWN=n

# ── SoftAP Wi-Fi provisioning ────────────────────────────────────────
CONFIG_SOFTAP_WIFI_PROVISION=y
CONFIG_SOFTAP_WIFI_PROVISION_THREAD_STACK_SIZE=8192
CONFIG_NANOPB=y
CONFIG_SMF=y
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_PARSER_URL=y
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="ringone"
# FS needed for SoftAP library linking
CONFIG_FILE_SYSTEM=y

# ── MQTT ────────────────────────────────────────────────────────────
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y

# ── TLS / nRF Security ──────────────────────────────────────────────
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=4
CONFIG_TLS_CREDENTIALS=y
# Protected storage: TLS credentials survive reboot (needed by SoftAP HTTPS server)
CONFIG_TLS_CREDENTIALS_BACKEND_PROTECTED_STORAGE=y
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_LEGACY_CRYPTO_C=y
CONFIG_MBEDTLS_RSA_C=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_MPI_MAX_SIZE=512
CONFIG_MBEDTLS_HEAP_SIZE=57000

# ── PSA ECC — required for SoftAP HTTPS server (ECDSA P-256) ────────
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y

# ── PSA Protected Storage — MQTT creds encrypted with CRACEN HUK ────
# TRUSTED_STORAGE uses AEAD (ChaChaPoly) with key derived from CRACEN
# hardware unique key. Credentials never appear in plaintext in flash.
CONFIG_TRUSTED_STORAGE=y
CONFIG_PSA_PROTECTED_STORAGE=y
CONFIG_HW_UNIQUE_KEY=y
CONFIG_HW_UNIQUE_KEY_RANDOM=y

# ── wifi_ready library — waits for WPA supplicant / nRF7002 FW load ─
CONFIG_WIFI_READY_LIB=y

# ── Wi-Fi credentials (provisioned via SoftAP or wifi_cred shell) ────
CONFIG_WIFI_CREDENTIALS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y

# ── Network buffers (size for MQTT JSON payload) ────────────────────
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NRF70_RX_NUM_BUFS=8
CONFIG_NET_PKT_BUF_RX_DATA_POOL_SIZE=4096
CONFIG_NET_PKT_BUF_TX_DATA_POOL_SIZE=4096

# ── Stack and heap sizes ────────────────────────────────────────────
CONFIG_HEAP_MEM_POOL_SIZE=40000
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=20000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=53000
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3100

# ── Floating-point printf (for JSON temp field) ─────────────────────
CONFIG_CBPRINTF_FP_SUPPORT=y

# ── Logging additions ────────────────────────────────────────────────
CONFIG_NET_LOG=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_LOG_LEVEL_INF=y
