# Ring•One "local_cloud" build overlay.
#
# Points the firmware at ../ringone-cloud-local (self-hosted InfluxDB +
# Mosquitto + Grafana behind self-signed TLS) instead of the live HiveMQ
# Cloud / InfluxDB Cloud accounts the Kconfig.ringone defaults point at.
#
# CONFIG_RINGONE_INFLUX_HOST and CONFIG_RINGONE_MQTT_BROKER_HOST are NOT
# set here — the target is a laptop's LAN IP, which changes with whatever
# network the demo runs on. Pass both at build time; `./ringone-cloud
# start` in ringone-cloud-local prints the exact IP to use:
#
#   west build -b nrf54lm20dk/nrf54lm20b/cpuapp app/ \
#     -- -DSHIELD="nrf7002eb2;nrf7002eb2_coex" \
#        -DEXTRA_CONF_FILE=local_cloud.conf \
#        -DCONFIG_RINGONE_INFLUX_HOST=\"<lan-ip>\" \
#        -DCONFIG_RINGONE_MQTT_BROKER_HOST=\"<lan-ip>:8883\"
#
# InfluxDB org/bucket already match ringone-cloud-local's .env by default
# (CONFIG_RINGONE_INFLUX_ORG="dotstar", CONFIG_RINGONE_INFLUX_BUCKET="ringone")
# — nothing to override there.
#
# The InfluxDB write token is provisioned at runtime, not build time:
#   uart:~$ ringone_cred set influx_token ringone-local-dev-token
#
# mosquitto.conf in ringone-cloud-local sets `allow_anonymous true` on
# every listener (closed LAN demo stack, never internet-reachable) — no
# MQTT credentials needed, so clear the Kconfig dev defaults rather than
# send them.
CONFIG_RINGONE_MQTT_USERNAME=""
CONFIG_RINGONE_MQTT_PASSWORD=""
