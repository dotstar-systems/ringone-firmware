        run: |
          echo "RING_ONE_TODO: TF-M /ns build not yet configured."
          echo "Target: nrf54lm20dk/nrf54lm20a/cpuapp/ns with shield nrf7002eb2;nrf7002eb2_coex"
          echo "See docs/cloud-setup.md for TF-M partition requirements."
          # west build \
          #   -b nrf54lm20dk/nrf54lm20a/cpuapp/ns \
          #   ringone-firmware/app \
          #   --build-dir build-wifi-secure \
          #   -- -DSHIELD="nrf7002eb2;nrf7002eb2_coex"

      - name: Upload secure artifact (placeholder)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
