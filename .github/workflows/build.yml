name: Build Ring-One Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          path: ringone-firmware

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Install west
        run: pip install west

      - name: Cache NCS modules
        id: cache-ncs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            .west
            nrf
            zephyr
            bootloader
            modules
            tools
          key: ncs-v3.3.0-${{ hashFiles('ringone-firmware/west.yml') }}
          restore-keys: ncs-v3.3.0-

      - name: West init & update
        if: steps.cache-ncs.outputs.cache-hit != 'true'
        run: |
          west init -l ringone-firmware
          west update -o=--depth=1 -n

      - name: West init (manifest only, modules from cache)
        if: steps.cache-ncs.outputs.cache-hit == 'true'
        run: west init -l ringone-firmware

      - name: Install Python requirements
        run: |
          pip install -r zephyr/scripts/requirements.txt
          pip install -r nrf/scripts/requirements.txt

      # Zephyr SDK version — verify against NCS v3.3.0 release notes if this changes
      - name: Cache Zephyr SDK
        id: cache-sdk
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/zephyr-sdk-0.17.0
          key: zephyr-sdk-0.17.0-arm

      - name: Install Zephyr SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.0/zephyr-sdk-0.17.0_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-0.17.0_linux-x86_64_minimal.tar.xz -C "$HOME"
          "$HOME/zephyr-sdk-0.17.0/setup.sh" -t arm-zephyr-eabi -c

      - name: Build
        run: |
          west build \
            -b nrf54l15dk/nrf54l15/cpuapp \
            ringone-firmware/app \
            --build-dir build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ringone-firmware
          path: |
            build/zephyr/zephyr.elf
            build/zephyr/zephyr.hex
          if-no-files-found: warn
