name: Build Ring-One Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── Shared setup steps (YAML anchor) ─────────────────────────────────
# Note: GitHub Actions does not support anchors natively in YAML; the
# steps are duplicated per job.  A composite action can DRY this up in a
# future refactor.  See RING_ONE_TODO in docs/cloud-setup.md.

jobs:
  # ── Job 1: BLE-only ──────────────────────────────────────────────
  build-ble-only:
    name: nRF54LM20DK BLE-only
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          path: ringone-firmware

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Install west
        run: pip install west

      - name: West init
        run: west init -l ringone-firmware

      - name: Cache NCS modules
        id: cache-ncs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            nrf
            zephyr
            bootloader
            modules
            tools
          key: ncs-v3.3.0-${{ hashFiles('ringone-firmware/west.yml') }}
          restore-keys: ncs-v3.3.0-

      - name: West update
        if: steps.cache-ncs.outputs.cache-hit != 'true'
        run: west update -o=--depth=1 -n

      - name: Install Python requirements
        run: |
          pip install -r zephyr/scripts/requirements.txt
          pip install -r nrf/scripts/requirements.txt

      - name: Cache Zephyr SDK
        id: cache-sdk
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/zephyr-sdk-0.17.0
          key: zephyr-sdk-0.17.0-arm

      - name: Install Zephyr SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.0/zephyr-sdk-0.17.0_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-0.17.0_linux-x86_64_minimal.tar.xz -C "$HOME"
          "$HOME/zephyr-sdk-0.17.0/setup.sh" -t arm-zephyr-eabi -c

      - name: Build BLE-only
        run: |
          west build \
            -b nrf54lm20dk/nrf54lm20a/cpuapp \
            ringone-firmware/app \
            --build-dir build-ble-only

      - name: Upload BLE-only artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ringone-ble-only-${{ github.sha }}
          path: |
            build-ble-only/zephyr/zephyr.elf
            build-ble-only/zephyr/zephyr.hex
          retention-days: 30

  # ── Job 2: Wi-Fi (primary) ───────────────────────────────────────
  build-wifi:
    name: nRF54LM20DK + nRF7002 EB2 (Wi-Fi + BLE coex)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          path: ringone-firmware

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Install west
        run: pip install west

      - name: West init
        run: west init -l ringone-firmware

      - name: Cache NCS modules
        id: cache-ncs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            nrf
            zephyr
            bootloader
            modules
            tools
          key: ncs-v3.3.0-${{ hashFiles('ringone-firmware/west.yml') }}
          restore-keys: ncs-v3.3.0-

      - name: West update
        if: steps.cache-ncs.outputs.cache-hit != 'true'
        run: west update -o=--depth=1 -n

      - name: Install Python requirements
        run: |
          pip install -r zephyr/scripts/requirements.txt
          pip install -r nrf/scripts/requirements.txt

      - name: Cache Zephyr SDK
        id: cache-sdk
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/zephyr-sdk-0.17.0
          key: zephyr-sdk-0.17.0-arm

      - name: Install Zephyr SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.0/zephyr-sdk-0.17.0_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-0.17.0_linux-x86_64_minimal.tar.xz -C "$HOME"
          "$HOME/zephyr-sdk-0.17.0/setup.sh" -t arm-zephyr-eabi -c

      - name: Build Wi-Fi + BLE coexistence
        run: |
          west build \
            -b nrf54lm20dk/nrf54lm20a/cpuapp \
            ringone-firmware/app \
            --build-dir build-wifi \
            -- -DSHIELD="nrf7002eb2;nrf7002eb2_coex"

      - name: Upload Wi-Fi artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ringone-wifi-${{ github.sha }}
          path: |
            build-wifi/zephyr/zephyr.elf
            build-wifi/zephyr/zephyr.hex
          retention-days: 30

  # ── Job 3: Wi-Fi + TF-M secure (future) ─────────────────────────
  build-wifi-secure:
    name: nRF54LM20DK/ns + nRF7002 EB2 (TF-M secure baseline)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          path: ringone-firmware

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Install west
        run: pip install west

      - name: West init
        run: west init -l ringone-firmware

      - name: Cache NCS modules
        id: cache-ncs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            nrf
            zephyr
            bootloader
            modules
            tools
          key: ncs-v3.3.0-${{ hashFiles('ringone-firmware/west.yml') }}
          restore-keys: ncs-v3.3.0-

      - name: West update
        if: steps.cache-ncs.outputs.cache-hit != 'true'
        run: west update -o=--depth=1 -n

      - name: Install Python requirements
        run: |
          pip install -r zephyr/scripts/requirements.txt
          pip install -r nrf/scripts/requirements.txt

      - name: Cache Zephyr SDK
        id: cache-sdk
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/zephyr-sdk-0.17.0
          key: zephyr-sdk-0.17.0-arm

      - name: Install Zephyr SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.0/zephyr-sdk-0.17.0_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-0.17.0_linux-x86_64_minimal.tar.xz -C "$HOME"
          "$HOME/zephyr-sdk-0.17.0/setup.sh" -t arm-zephyr-eabi -c

      # RING_ONE_TODO: enable TF-M partition
      # The /ns target (nrf54lm20dk/nrf54lm20a/cpuapp/ns) requires a
      # TF-M build configuration.  Once the Secure Processing Environment
      # partition is configured in pm_static.yml and the TF-M trust zone
